# Wrapper changes must bump wrappers/web/package.json version to be published.
# The first version was published manually because npm trusted publishing can
# only be configured on an existing package.
#
# The trusted publisher only allows *staged* publishing: this workflow submits
# the version with `npm stage publish`, and it goes live only after a maintainer
# approves it with 2FA (npmjs.com > Staged Packages, or `npm stage approve`).

name: Publish web wrapper

on:
  push:
    branches: [main]
    paths: ['wrappers/web/**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # `npm stage` requires npm >= 11.15.0 (trusted publishing itself >= 11.5.1).
      - name: Ensure npm supports staged trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@^11.15.0
          npm --version
          node --version

      # Configure npm's trusted publisher for tik-choco-lab/mistlib-examples,
      # workflow publish-web.yml, with no environment. OIDC provides provenance.
      - name: Publish
        working-directory: wrappers/web
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if published=$(npm view "@tik-choco/mistlib-web@$version" version) && [ "$published" = "$version" ]; then
            echo "already published"
            exit 0
          fi
          npm stage publish
