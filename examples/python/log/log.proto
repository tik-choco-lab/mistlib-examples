// log.proto （Python・Go両方が使う）
syntax = "proto3";
option go_package = "mistlib.dev/tests/go/internal/logproto;logproto";

service LogService {
  rpc StreamLogs(stream LogEntry) returns (Ack);
}

message LogEntry {
  string node_id   = 1;
  string trace_id  = 2;
  string level     = 3;
  string message   = 4;
  string timestamp = 5;
  map<string, string> fields = 6;
}

message Ack {
  int64 received_count = 1;
}
