# Reconciles the demo import maps with the engine version supported by this
# wrapper. Only scripts/engine-api.json selects the version; npm's latest tag
# must never upgrade or downgrade the unified event contract automatically.
# The published API and event enum values are checked before moving a pin.

name: Update engine

on:
  schedule:
    # 03:00 UTC daily. Nothing is urgent here; a release reaches the demos
    # within a day.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-engine
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the current and supported versions
        id: versions
        run: |
          set -euo pipefail
          current=$(grep -ohE '@tik-choco/mistlib@[0-9]+\.[0-9]+\.[0-9]+' examples/web/*.html \
            | head -1 | sed 's/.*@//')
          supported=$(node -p "require('./scripts/engine-api.json').engineVersion")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "supported=$supported"   >> "$GITHUB_OUTPUT"
          echo "pinned at $current, supported engine is $supported"

          # Every pin must agree, or the rewrite below would leave the repo in a
          # mixed state that is hard to notice.
          mismatched=$(grep -ohE '@tik-choco/mistlib@[0-9]+\.[0-9]+\.[0-9]+' examples/web/*.html \
            | sort -u | wc -l)
          test "$mismatched" -eq 1 \
            || { echo "::error::the examples pin more than one engine version"; exit 1; }

      - name: Check the wrapper still fits the new version
        if: steps.versions.outputs.current != steps.versions.outputs.supported
        run: node scripts/check-engine-api.mjs "${{ steps.versions.outputs.supported }}"

      - name: Move the pin
        if: steps.versions.outputs.current != steps.versions.outputs.supported
        run: |
          set -euo pipefail
          from="${{ steps.versions.outputs.current }}"
          to="${{ steps.versions.outputs.supported }}"
          # Reconcile import maps with the version already selected in the manifest.
          sed -i "s|@tik-choco/mistlib@$from|@tik-choco/mistlib@$to|g" examples/web/*.html
          node scripts/check-engine-api.mjs --source
          git diff --stat

      - name: Commit
        if: steps.versions.outputs.current != steps.versions.outputs.supported
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "nothing changed"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: move examples to @tik-choco/mistlib@${{ steps.versions.outputs.supported }}

          Verified that the published build still provides every export
          wrappers/web/index.js uses, including event values, before moving the pin."
          git push
